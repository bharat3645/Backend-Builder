name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  backend-tests:
    name: Core engine tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: core/requirements.txt

      - name: Install core dependencies
        run: pip install -r core/requirements.txt

      - name: Run pytest with coverage
        working-directory: core
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-report
          path: core/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend build, lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

  generator-smoke:
    name: Generated output actually builds (Django / Go / Rails)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: core/requirements.txt

      - name: Install core dependencies (needed by the generators themselves)
        run: pip install -r core/requirements.txt

      - name: Generate a sample project for every framework
        run: |
          python core/scripts/generate_sample_projects.py \
            --dsl dsl/example_blog.yml --framework all --out "${{ runner.temp }}/generated"

      # -- Django: install the *generated* project's own requirements.txt
      # and run Django's own system checks + migration planning against it.
      - name: Django - manage.py check / makemigrations
        working-directory: ${{ runner.temp }}/generated/django
        run: |
          pip install -r requirements.txt
          python manage.py check --fail-level WARNING
          python manage.py makemigrations --check --dry-run || python manage.py makemigrations

      # -- Go: build and vet the generated Fiber+GORM project with the real
      # Go toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Go - build & vet
        working-directory: ${{ runner.temp }}/generated/go-fiber
        run: |
          go mod tidy
          go build ./...
          go vet ./...

      # -- Rails: no database/bundler in CI, so this is a real Ruby parser
      # syntax check (`ruby -c`) of every generated .rb file rather than a
      # full `rails server` boot - still catches the class of bug this
      # generator has historically had (bad arg ordering, malformed
      # migrations, invalid class names).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Rails - Ruby syntax check every generated file
        working-directory: ${{ runner.temp }}/generated/rails
        run: |
          find . -name '*.rb' -print0 | xargs -0 -n1 ruby -c
