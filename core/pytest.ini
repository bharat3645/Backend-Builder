[pytest]
; core/app.py and core/generators/*.py import as `from generators.x import Y`
; / `from parsers.x import Y`, i.e. they assume `core/` itself (not the repo
; root) is on sys.path - exactly how it runs in production (Dockerfile does
; `WORKDIR /app/core` before `python app.py`, and copilot's CLI shells out
; the same way). `pythonpath = .` puts this file's directory (core/) on
; sys.path for the test run so imports resolve the same way here.
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -ra
